aid: plotbox
name: PlotBox
description: PlotBox is a deathcare management platform for cemeteries, crematories, and funeral homes.
  Founded in Northern Ireland, its cloud SaaS combines records management, interactive digital cemetery
  mapping, financial and trust-fund management, work orders, scheduling, and family-facing records portals
  to help deathcare providers run compliant, efficient operations. PlotBox serves over 2,000 facilities
  globally, is hosted on Microsoft Azure, and holds ISO 9001 and ISO 27001 certifications. The company
  does not currently publish a public developer API or developer portal.
